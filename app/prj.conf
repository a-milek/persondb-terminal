CONFIG_LOG=y
CONFIG_APP_CBOR_PERSONDB_LOG_LEVEL_INF=y

# The storage slice this app uses: L1 + L1.5 + the L2 Map provider. kvdb (L3)
# is deliberately absent. The flight store is a set of L2 containers, one per
# kind of record, with every root in one app-owned superblock under a single
# rootreg key. See DESIGN.md §12.
CONFIG_BLOB_DB=y
CONFIG_BLOB_ROOTREG=y
CONFIG_BLOB_CONTAINER_KVHASH=y

# CBOR — Zephyr's own codec. Canonical encoding keeps a record's bytes a pure
# function of its content, which is what lets verification compare encodings
# rather than decoded structs.
CONFIG_ZCBOR=y
CONFIG_ZCBOR_CANONICAL=y

# kvhash derives both its bucket size and its bucket count from this one
# symbol: a bucket may hold MAX_PAYLOAD bytes and a map (MAX_PAYLOAD-8)/8
# buckets, so map capacity is ~MAX_PAYLOAD^2/8. blob_db_mount() checks that the
# value is usable on the target geometry (FINDINGS.md B9/B10).
#
# It is NOT set to the 32 722 B the geometry sustains: at that size the bucket
# directory owns an entire 64 KB erase block, blob_db compacts on every
# rewrite, and a fill dies almost at once with -ENOSPC (FINDINGS.md K12). Past
# half-full, a 16 384 B directory blob can no longer be placed either (K13).
CONFIG_BLOB_DB_MAX_PAYLOAD_LEN=16384

# Count flash operations and bytes at the storage seam, for the store
# statistics on the utilities screen.
CONFIG_BLOB_DB_IOSTATS=y

# Keep the storage stack quiet so per-op logging does not perturb timings.
CONFIG_BLOB_DB_LOG_LEVEL_WRN=y
CONFIG_ROOTREG_LOG_LEVEL_WRN=y
CONFIG_BLOB_CONTAINER_KVHASH_LOG_LEVEL_WRN=y

# blob_db builds every slot in a CONFIG_BLOB_DB_MAX_PAYLOAD_LEN + 46 byte
# *stack* frame (FINDINGS.md B5, job 3), so the write path needs ~16.4 KB for
# that frame alone plus the frames above it. 28 KB leaves a margin over the
# measured worst case.
CONFIG_MAIN_STACK_SIZE=28672
# Match the DK: blob_db stages a whole 64 KB erase block in .bss.
CONFIG_BLOB_DB_SECTOR_BUF_SIZE=65536

# blob_db invalidates bucket headers by programming 0x00 over already-
# programmed magic bytes (1->0 only, legal on real NOR without an erase). The
# flash simulator rejects program-over-non-erased by default.
CONFIG_FLASH_SIMULATOR_DOUBLE_WRITES=y
